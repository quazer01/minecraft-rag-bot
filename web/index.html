<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CraftGuide</title>
<style>
  :root {
    --bg: #f4f1ea; --panel: #ffffff; --text: #1f2421; --muted: #6b6f68; --line: #dcd6c8;
    --accent: #3f7d3a; --accent-text: #ffffff; --user: #e3eedc; --code: #f0ece2; --badge: #ece6d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161a17; --panel: #1f2420; --text: #e6e8e3; --muted: #9aa097; --line: #343b35;
      --accent: #6fb565; --accent-text: #0f1410; --user: #2a3a28; --code: #2a302b; --badge: #2c332d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { max-width: 820px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; padding: 0 16px; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 1.2rem; margin: 0; }
  .backend { font-size: .8rem; color: var(--muted); }
  header button { margin-left: auto; }
  #log { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 92%; flex-shrink: 0; padding: 10px 14px; border-radius: 12px; background: var(--panel);
         border: 1px solid var(--line); overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); white-space: pre-wrap; }
  .msg.bot p { margin: .3em 0; }
  .msg.bot ul { margin: .3em 0; padding-left: 1.3em; }
  .table-wrap { overflow-x: auto; }
  .msg table { border-collapse: collapse; margin: .4em 0; font-size: .9rem; overflow-wrap: normal; }
  .msg th, .msg td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  .msg code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: .9em; }
  .msg pre { background: var(--code); padding: 8px; border-radius: 6px; overflow-x: auto; }
  .meta { margin-top: 8px; font-size: .78rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; }
  .badge { background: var(--badge); border-radius: 999px; padding: 1px 8px; }
  .error { color: #c0392b; }
  .thinking { color: var(--muted); font-style: italic; }
  .thinking span { animation: blink 1.4s infinite both; }
  .thinking span:nth-child(2) { animation-delay: .2s; }
  .thinking span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .thinking span { animation: none; } }
  form { display: flex; gap: 8px; padding: 12px 0 16px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; font: inherit; padding: 10px; border-radius: 10px;
             border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  button { font: inherit; border: 0; border-radius: 10px; padding: 8px 16px; cursor: pointer;
           background: var(--accent); color: var(--accent-text); }
  button.secondary { background: var(--badge); color: var(--text); }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>⛏️ CraftGuide</h1>
    <span class="backend" id="backend"></span>
    <button class="secondary" id="reset" type="button">New chat</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <textarea id="input" rows="2" placeholder="Ask about crafting, mobs, redstone… (Enter to send)" autofocus></textarea>
    <button id="send">Send</button>
  </form>
</div>
<script>
const log = document.getElementById("log"), input = document.getElementById("input"),
      send = document.getElementById("send");
let history = [];

const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const inline = s => esc(s)
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

// Just enough Markdown for the answers: paragraphs, lists, tables, code blocks, bold, inline code.
function render(md) {
  const lines = md.split("\n"), out = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.trim().startsWith("```")) {
      const code = [], indent = line.search(/\S/);
      while (++i < lines.length && !lines[i].trim().startsWith("```"))
        code.push(lines[i].slice(Math.min(indent, lines[i].search(/\S|$/))));
      out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
    } else if (line.trim().startsWith("|")) {
      const rows = [];
      for (; i < lines.length && lines[i].trim().startsWith("|"); i++) rows.push(lines[i].trim());
      i--;
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      const sep = rows.length > 1 && /^[|\-:\s]+$/.test(rows[1]);
      const head = sep ? `<tr>${cells(rows[0]).map(c => `<th>${c}</th>`).join("")}</tr>` : "";
      const body = rows.slice(sep ? 2 : 0).map(r => `<tr>${cells(r).map(c => `<td>${c}</td>`).join("")}</tr>`);
      out.push(`<div class="table-wrap"><table>${head}${body.join("")}</table></div>`);
    } else if (/^\s*([-*]|\d+\.)\s/.test(line)) {
      const items = [];
      for (; i < lines.length && /^\s*([-*]|\d+\.)\s/.test(lines[i]); i++)
        items.push(`<li>${inline(lines[i].replace(/^\s*([-*]|\d+\.)\s/, ""))}</li>`);
      i--;
      out.push(`<ul>${items.join("")}</ul>`);
    } else if (line.trim()) {
      out.push(`<p>${inline(line.replace(/^#+\s*/, ""))}</p>`);
    }
  }
  return out.join("");
}

function add(role, html, meta) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.innerHTML = html;
  if (meta) div.appendChild(meta);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function metaFor(data) {
  const meta = document.createElement("div");
  meta.className = "meta";
  const badges = [data.route === "chitchat" ? "chat (no search)" : "searched library"];
  for (const s of data.sources) badges.push(s.title + (s.edition !== "both" ? ` · ${s.edition}` : ""));
  meta.innerHTML = badges.map(b => `<span class="badge">${esc(b)}</span>`).join("");
  return meta;
}

function greet() {
  add("bot", render("Hi! I'm **CraftGuide**. Ask me anything about Minecraft: recipes, mobs, biomes, redstone, enchanting or commands."));
}

async function ask(message) {
  add("user", esc(message));
  const pending = add("bot", '<p class="thinking">thinking<span>.</span><span>.</span><span>.</span></p>');
  send.disabled = true;
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message, history}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    history = data.history;
    pending.innerHTML = render(data.answer);
    pending.appendChild(metaFor(data));
  } catch (e) {
    pending.innerHTML = `<p class="error">Something went wrong: ${esc(e.message)}</p>`;
  } finally {
    log.scrollTop = log.scrollHeight;
    send.disabled = false;
    input.focus();
  }
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message || send.disabled) return;
  input.value = "";
  ask(message);
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); }
});
document.getElementById("reset").addEventListener("click", () => {
  history = []; log.innerHTML = ""; greet(); input.focus();
});

fetch("/api/info").then(r => r.json()).then(info => {
  document.getElementById("backend").textContent =
    `${info.backend === "ollama" ? `Ollama · ${info.model}` : "offline mode"} · ${info.chunks} chunks`;
}).catch(() => {});
greet();
</script>
</body>
</html>
